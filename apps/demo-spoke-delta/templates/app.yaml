apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: ai-bench
spec:
  # omitted when the HPA owns the replica count, so the
  # two do not fight over it on every sync
  {{- if not .Values.app.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/part-of: ai-bench
      annotations:
        # picked up by vmagent's kubernetes-pods job
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.app.service.port }}"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
          env:
            - name: BASELINE_MEMORY_MB
              value: "{{ .Values.app.baselineMemoryMb }}"
            - name: FLAP_ENABLED
              value: "{{ .Values.app.probes.flapping }}"
            - name: FLAP_PERIOD_SECONDS
              value: "{{ .Values.app.probes.flapPeriodSeconds }}"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@demo-postgres:5432/{{ .Values.postgres.database }}"
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            # tight, so a flapping readiness actually
            # registers as readiness churn
            periodSeconds: 5
            failureThreshold: 1
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      nodePort: {{ .Values.app.service.nodePort }}
{{- if .Values.app.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: {{ .Values.app.hpa.minReplicas }}
  maxReplicas: {{ .Values.app.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.app.pdb.enabled }}
---
# #64. Named like the Deployment on purpose: the alert rule copies the
# budget's name into `deployment`, which is how the agent finds the
# replica count the budget should be sized against.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
spec:
  minAvailable: {{ .Values.app.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
{{- end }}

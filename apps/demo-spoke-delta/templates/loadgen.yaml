{{- if .Values.loadgen.enabled }}
# Traffic source for the faults that only exist under
# load. Off in the baseline so the bench idles quiet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-loadgen
  labels:
    app.kubernetes.io/name: demo-loadgen
    app.kubernetes.io/part-of: ai-bench
spec:
  replicas: {{ .Values.loadgen.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-loadgen
        app.kubernetes.io/part-of: ai-bench
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              # N concurrent request loops against /work
              i=0
              while [ "$i" -lt {{ .Values.loadgen.concurrency }} ]; do
                (
                  while true; do
                    curl -s -o /dev/null --max-time 10 \
                      "http://demo-app:{{ .Values.app.service.port }}/work?ms={{ .Values.loadgen.burnMs }}" \
                      || true
                  done
                ) &
                i=$((i+1))
              done
              wait
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
{{- end }}

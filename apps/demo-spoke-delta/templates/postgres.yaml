{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-postgres
  labels:
    app.kubernetes.io/name: demo-postgres
    app.kubernetes.io/part-of: ai-bench
spec:
  # 0 is the db-down fault, not a mistake
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-postgres
        app.kubernetes.io/part-of: ai-bench
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # bench data is disposable by design
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-postgres
  labels:
    app.kubernetes.io/name: demo-postgres
spec:
  selector:
    app.kubernetes.io/name: demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
